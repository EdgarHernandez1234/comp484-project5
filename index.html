<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSUN Map Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz-wrapper">
    <section class="quiz-panel">
      <h1>CSUN Map Quiz</h1>

      <p class="instructions">
        Double-click the map where you think the location is.
      </p>

      <h2 id="question">Loading map...</h2>

      <p id="feedback" class="feedback">
        Wait for the map to load.
      </p>

      <div class="stats">
        <p><strong>Question:</strong> <span id="question-count">0 / 5</span></p>
        <p><strong>Correct:</strong> <span id="score">0</span></p>
        <p><strong>Time:</strong> <span id="timer">0.0s</span></p>
        <p><strong>Best:</strong> <span id="best-score">No score yet</span></p>
      </div>

      <button id="new-game" class="new-game" hidden>Play Again</button>

      <ol id="history" class="history"></ol>
    </section>

    <section class="map-panel">
      <div id="map"></div>
    </section>
    <aside class="leaderboard-panel">
  <h2>Top Scores</h2>
  <p class="leaderboard-subtitle">Top 3 Scores</p>

  <ol id="leaderboard-list" class="leaderboard-list">
    <li>---</li>
    <li>---</li>
    <li>---</li>
  </ol>
</aside>
  </main>

  <script src="script.js"></script>

  <!--API Key is set up -->
  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBmIbfcMWaDEWPpDn6pFnOmpeI2zHqjRM4&loading=async&callback=initMap&v=weekly"> 
  </script>
</body>
</html>
